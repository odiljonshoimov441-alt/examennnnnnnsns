    /* ---- PyCharm-uslubidagi Python muharriri ---- */
    const PK = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
    const PB = new Set('print input len range int float str list dict set tuple bool sum min max abs round sorted enumerate zip map filter type open reversed any all isinstance pow divmod chr ord'.split(' '));
    function hlPy(src) {
        const re = /(#[^\n]*)|("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/g;
        let out = '', m, prev = '';
        while ((m = re.exec(src))) {
            const t = esc(m[0]);
            if (m[1]) out += `<span class="tk-c">${t}</span>`;
            else if (m[2]) out += `<span class="tk-s">${t}</span>`;
            else if (m[3]) out += `<span class="tk-n">${t}</span>`;
            else if (m[4]) { const w = m[4]; out += PK.has(w) ? `<span class="tk-k">${t}</span>` : (prev === 'def' || prev === 'class') ? `<span class="tk-f">${t}</span>` : PB.has(w) ? `<span class="tk-b">${t}</span>` : t; prev = w; }
            else { out += t; if (!/\s/.test(m[0])) prev = ''; }
        }
        return out;
    }
    const pyEd = (id, val, attrs = '') => `<div class="ed"><div class="edtop"><i></i><i></i><i></i><span>🐍 main.py</span><small>Ctrl+Enter — Run · Tab — 4 bo‘shliq</small></div><div class="edb"><div class="gut">1</div><div class="edw"><pre class="hl"></pre><textarea class="py" id="${id}" spellcheck="false" autocapitalize="none" autocomplete="off" autocorrect="off" ${attrs}>${esc(val)}</textarea></div></div></div>`;
    const isEd = t => t.classList && t.classList.contains('py');
    function edRefresh(t) {
        const w = t.parentElement, n = t.value.split('\n').length;
        w.querySelector('pre').innerHTML = hlPy(t.value) + '\n';
        w.previousElementSibling.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
        t.style.height = Math.max(6, n) * 20 + 32 + 'px'; w.querySelector('pre').scrollLeft = t.scrollLeft;
    }
    const edAll = () => document.querySelectorAll('textarea.py').forEach(edRefresh);
    function ins(t, text) { t.focus(); if (!document.execCommand('insertText', false, text)) { t.setRangeText(text, t.selectionStart, t.selectionEnd, 'end'); t.dispatchEvent(new Event('input', { bubbles: true })); } }
    function delSel(t) { if (!document.execCommand('delete')) { t.setRangeText('', t.selectionStart, t.selectionEnd, 'end'); t.dispatchEvent(new Event('input', { bubbles: true })); } }
    document.addEventListener('scroll', e => { if (e.target.classList && isEd(e.target)) e.target.parentElement.querySelector('pre').scrollLeft = e.target.scrollLeft; }, true);
    document.addEventListener('keydown', e => {
        const t = e.target; if (!isEd(t)) return;
        const v = t.value, a = t.selectionStart, b = t.selectionEnd, ls = v.lastIndexOf('\n', a - 1) + 1;
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || e.shiftKey)) { e.preventDefault(); const btn = t.closest('.card').querySelector('button.alt'); if (btn) btn.click(); return; }
        if (e.key === 'Enter') {
            e.preventDefault(); const line = v.slice(ls, a); let ind = line.match(/^ */)[0];
            if (/:\s*$/.test(line)) ind += '    '; else if (/^\s*(return|break|continue|pass|raise)\b/.test(line) && ind.length >= 4) ind = ind.slice(4);
            ins(t, '\n' + ind); return;
        }
        if (e.key === 'Tab') {
            e.preventDefault();
            if (e.shiftKey || (a !== b && v.slice(a, b).includes('\n'))) {
                const le = v.indexOf('\n', b), end = le < 0 ? v.length : le, nb = v.slice(ls, end).split('\n').map(l => e.shiftKey ? l.replace(/^ {1,4}/, '') : '    ' + l).join('\n');
                t.setSelectionRange(ls, end); ins(t, nb); t.setSelectionRange(ls, ls + nb.length);
            } else ins(t, '    ');
            return;
        }
        if (e.key === 'Backspace' && a === b) {
            const before = v.slice(ls, a);
            if (before.length && /^ +$/.test(before)) { e.preventDefault(); const k = before.length % 4 || 4; t.setSelectionRange(a - k, a); delSel(t); }
        }
    });
    document.addEventListener('input', e => {
        const t = e.target; if (!isEd(t)) return;
        if (e.data === ':') {
            const v = t.value, a = t.selectionStart, ls = v.lastIndexOf('\n', a - 1) + 1, line = v.slice(ls, a);
            if (/^ +(else|elif\b.*|except\b.*|finally)\s*:$/.test(line)) {
                const cur = line.match(/^ */)[0].length, lines = v.slice(0, ls).split('\n');
                for (let i = lines.length - 1; i >= 0; i--) {
                    const L = lines[i]; if (!L.trim()) continue;
                    const ind = L.match(/^ */)[0].length, open = /^\s*(if|elif|for|while|try|except)\b/.test(L);
                    if (ind === cur && open) break;
                    if (ind < cur) { if (open) { t.setSelectionRange(ls, ls + cur); ins(t, ' '.repeat(ind)); const np = a - (cur - ind); t.setSelectionRange(np, np); } break; }
                }
            }
        }
        edRefresh(t);
    });

  <input id="pt" type="number" min="0.01" max="100" step="any" placeholder="Shu savol uchun ball (masalan 2 yoki 2.5; standart: 1)"><div class="err" id="e"></div><button onclick="addQ()">Qo‘shish</button></div>
  <div class="card"><h2>🎯 Ball berish (oraliq bo‘yicha)</h2><small>Masalan: 1 dan 10 gacha — 2 ball, 11 dan 20 gacha — 5 ball.</small>
  <select id="bm"><option value="1">1-oylik test</option><option value="2">2-oylik test</option><option value="3">3-oylik test</option></select><input id="bf" type="number" min="1" placeholder="Nechanchi savoldan (masalan 1)"><input id="bt" type="number" min="1" placeholder="Nechanchi savolgacha (masalan 10)"><input id="bp" type="number" min="0.01" max="100" step="any" placeholder="Ball (masalan 2 yoki 2.5)">
  <div class="err" id="be"></div><button class="alt" onclick="bulkPts()">Ball belgilash</button></div>
  <div class="card"><h2>🐍 Python (Run)</h2>${pyEd('pc', DEF_PY)}<button class="alt" onclick="tRun()">▶ Run</button><pre class="out" id="po"></pre></div>
  <div class="card"><h2>📥 Tayyor savollar</h2><small>PDF dagi 30 ta test (to‘g‘ri javoblari belgilangan) va 10 ta amaliy savol.</small><button class="alt" onclick="importSeed()">📥 30 test + 10 amaliyni qo‘shish</button><select id="cm"><option value="1">1-oy savollari</option><option value="2">2-oy savollari</option><option value="3">3-oy savollari</option><option value="0">Hammasi</option></select><button class="red" onclick="clearQs()">🗑 Tanlanganini o‘chirish</button><button class="gray" onclick="rescore()">🔄 Natijalarni qayta hisoblash</button><div class="smsg" id="im"></div></div>
  <div class="card"><h2>📚 Savollar (<span id="qn">0</span>)</h2><small>✅ — to‘g‘ri javob. Boshqa variantni bossangiz, to‘g‘ri javob o‘zgaradi va natijalar qayta hisoblanadi.</small><div id="ql"></div></div></section>
  <section class="sec" id="s-rate" hidden></section><section class="sec" id="s-hist" hidden></section></div>`;
        edAll(); since = 0; first = true; alerts = []; poll(); clearInterval(pollT); pollT = setInterval(() => { if (!document.hidden) poll(); }, 9000);
    }
    function tyChange() { const t = $('#ty').value; $('#f-mcq').style.display = t === 'mcq' ? '' : 'none'; $('#f-ans').style.display = (t === 'text' || t === 'code') ? '' : 'none'; }
    async function tRun() { const o = $('#po'); o.classList.remove('bad'); o.textContent = '⏳ ...'; setOut(o, await runPy($('#pc').value)); }
    async function poll() {
        try {
            const d = await api('t/state?since=' + since);
            d.alerts.forEach(a => { since = Math.max(since, a.id); alerts.unshift(a); if (!first) { toast(a); beep(); } });
            first = false;
            const cnt = k => d.students.filter(x => x.status === k).length;
            $('#chips').innerHTML = `<span class="chip">👥 Jami: ${new Set(d.students.map(x => x.login)).size}</span><span class="chip">✍️ Yechmoqda: ${cnt('running')}</span><span class="chip">✅ Tugatgan: ${cnt('done')}</span><span class="chip">⏳ Kutmoqda: ${cnt('waiting')}</span>`;
            if (alerts.length) $('#al').innerHTML = alerts.slice(0, 30).map(a => `<div class="al"><b>${esc(a.name)}</b> (${esc(a.login)}) ${TYPE[a.type] || ''}<br><small>${new Date(a.t).toLocaleTimeString()} — ${esc(a.detail)}</small></div>`).join('');
            const S = { waiting: '⏳ kutmoqda', running: '✍️ yechmoqda', done: '✅ tugatdi' };
            $('#st').innerHTML = d.students.length ? `<table><tr><th>Ism</th><th>Holat</th><th>Ball</th><th>Chiqish</th><th></th></tr>` + d.students.map(s =>
                `<tr><td>${esc(s.name)}${s.m ? ` <span class="pill">${s.m}-oy</span>` : ''}<br><small>${esc(s.login)}</small></td><td>${S[s.status]}${s.remaining != null ? '<br><small>' + Math.ceil(s.remaining / 60000) + ' daq qoldi</small>' : ''}</td><td>${s.score != null ? s.score + '/' + s.total + ' (' + pct(s) + '%)' : '—'}</td><td>${s.left}</td><td><button class="sm" title="Javoblarini ko‘rish" onclick="showAns('${esc(s.login)}',${s.m || 1})">👁</button> <button class="sm" title="Yangi parol berish" onclick="setPass('${esc(s.login)}')">🔑</button> ${s.status === 'waiting' ? '' : `<button class="sm" title="Qayta topshirtirish" onclick="retake('${esc(s.login)}',${s.m})">🔁</button>`}</td></tr>`).join('') + '</table>' : 'Hali studentlar yo‘q';
            $('#qn').textContent = d.questions.length;
            $('#ql').innerHTML = [1, 2, 3].map(mm => { const L = d.questions.filter(q => (q.m || 1) === mm); return `<h3 class="mh">📅 ${mm}-oylik test <span class="pill">${L.length} ta</span></h3>` + (L.map(qCard).join('') || '<small>Hozircha savol yo‘q — studentlar “hozircha test mavjud emas” deb ko‘radi.</small>'); }).join('');
        } catch {}
    }
    function qCard(q, i) { const t = q.type || 'mcq'; return `<div class="al q"><b>${i + 1}. ${esc(q.text)}</b><span class="pill">${LBL[t]}</span><span class="pill">${q.pts || 1} ball</span>` + (t === 'mcq' ? q.options.map((o, j) => `<div class="co" title="Bosib to‘g‘ri javob qiling" onclick="setCorrect('${q.id}',${j})">${j === q.correct ? '✅' : '▫️'} ${esc(o)}</div>`).join('') : `<div>✅ ${t === 'practice' ? 'Kamida 40 ta belgi yozsa to‘g‘ri' : esc(q.answer)}</div>`) + `<button class="red" onclick="delQ('${q.id}')">O‘chirish</button></div>`; }
    async function addQ() {
        const ty = $('#ty').value, o = { type: ty, m: $('#qm').value, text: $('#qt').value, pts: $('#pt').value };
        if (ty === 'mcq') { const all = [...document.querySelectorAll('.o')].map(x => x.value.trim()), idx = Number(document.querySelector('input[name=c]:checked').value); o.options = all.filter(Boolean); o.correct = o.options.indexOf(all[idx]); }
        else if (ty !== 'practice') { o.answer = $('#an').value; }
        try {
            await api('t/question', 'POST', o);
            ['#qt', '#pt', '#an'].forEach(x => $(x).value = ''); document.querySelectorAll('.o').forEach(x => x.value = ''); $('#e').textContent = ''; poll();
        } catch (e) { $('#e').textContent = e.message; }
    }
    async function bulkPts() {
        try { await api('t/points', 'POST', { m: $('#bm').value, from: $('#bf').value, to: $('#bt').value, points: $('#bp').value }); $('#be').textContent = '✅ Saqlandi'; poll(); }
        catch (e) { $('#be').textContent = e.message; }
    }
    async function setCorrect(id, j) {
        try { await api('t/correct', 'POST', { id, correct: j }); poll(); toast({ name: '✅ To‘g‘ri javob o‘zgartirildi, natijalar qayta hisoblandi', type: '' }); } catch (e) { alert(e.message); }
    }
    async function rescore() { try { await api('t/rescore', 'POST'); $('#im').textContent = '✅ Natijalar qayta hisoblandi'; poll(); } catch (e) { $('#im').textContent = e.message; } }
    async function importSeed() {
        if (!confirm('PDF dagi ' + SEED.length + ' ta savol (30 test + 10 amaliy) 1-oylik testga qo‘shilsinmi? Bor savollar takrorlanmaydi.')) return;
        try { const r = await api('t/import', 'POST', { questions: SEED }); $('#im').textContent = '✅ ' + r.added + ' ta savol qo‘shildi'; poll(); } catch (e) { $('#im').textContent = e.message; }
    }
    async function clearQs() {
        if (!confirm('Tanlangan savollar o‘chiriladi! Davom etasizmi?')) return;
        try { await api('t/clear', 'POST', { m: +$('#cm').value }); $('#im').textContent = '🗑 Savollar tozalandi'; poll(); } catch (e) { $('#im').textContent = e.message; }
    }
    const plen = x => String(x ?? '').replace(/\s+/g, ' ').trim().length;
    function cnt(i, v) { const e = $('#cc' + i); if (e) { e.textContent = plen(v) + ' / 40 belgi'; e.classList.toggle('ok', plen(v) >= 40); } }
    function unansMsg() { const u = qs.filter(q => ans[q.id] === undefined || String(ans[q.id]).trim() === '').length; return u ? 'Hali ' + u + ' ta savolga javob bermadingiz. Baribir yakunlaysizmi?' : 'Testni yakunlaysizmi?'; }
    async function showAns(l, m) {
        try {
            const d = await api('m/answers?login=' + encodeURIComponent(l) + '&m=' + (m || 1)), st = d.student, S = { waiting: '⏳ kutmoqda', running: '✍️ yechmoqda (hozirgacha belgilaganlari)', done: '✅ tugatgan' };
            const items = d.items.map((it, i) => {
                const v = !it.answered ? '⏳' : it.good ? '✅' : '❌';
                const body = it.type === 'mcq'
                    ? it.options.map((o, j) => { const pick = it.given === j, right = j === it.correct; return `<div class="ao ${pick ? (right ? 'ok' : 'no') : right ? 'rt' : ''}">${pick ? (right ? '✅' : '❌') : right ? '✔️' : '▫️'} ${esc(o)}${pick ? ' <small>← tanlagan</small>' : ''}${right && !pick ? ' <small>(to‘g‘ri javob)</small>' : ''}</div>`; }).join('')
                    : `<div class="ga"><small>Javobi:</small><pre>${it.answered ? esc(it.given) : '— javob berilmagan —'}</pre></div>` + (it.type === 'practice' ? '' : `<div class="ao rt">✔️ To‘g‘ri javob: ${esc(it.answer)}</div>`);
                return `<div class="al q"><b>${i + 1}. ${esc(it.text)}</b> ${v} <span class="pill">${it.pts} ball</span>${body}</div>`;
            }).join('');
            const md = document.createElement('div'); md.className = 'mdl'; md.onclick = e => { if (e.target === md) md.remove(); };
            md.innerHTML = `<div class="box"><div class="top"><h2>👁 ${esc(st.name)} <span class="pill">${st.m}-oylik test</span></h2><button class="gray sm" onclick="this.closest('.mdl').remove()">✖ Yopish</button></div><p class="sub">${S[st.status]}${st.n ? ' · ' + st.correct + '/' + st.n + ' to‘g‘ri · ' + st.score + '/' + st.total + ' ball' : ''}</p>${items || 'Savollar yo‘q'}</div>`;
            document.body.appendChild(md);
        } catch (e) { alert(e.message); }
    }
    async function delQ(id) { if (confirm('O‘chirilsinmi?')) { await api('t/question/' + id, 'DELETE'); poll(); } }

    /* ---------- ADMIN ---------- */
    function adminView() {
        $('#hot').innerHTML = '';
        app.innerHTML = `<div class="wrap"><div class="card top"><h2>🛡️ Admin paneli</h2><button class="gray sm" onclick="logout()">Chiqish</button></div>
  ${tabsHtml([['ast', '⚙️ Boshqaruv'], ['rate', '🏅 Reyting'], ['hist', '🕘 Tarix']])}<section class="sec" id="s-ast"></section><section class="sec" id="s-rate" hidden></section><section class="sec" id="s-hist" hidden></section></div>`;
        adminState(); clearInterval(pollT); pollT = setInterval(adminState, 8000);
    }
    async function adminState() {
        try {
            const d = await api('a/state'), S = { waiting: '⏳', running: '✍️', done: '✅' };
            $('#s-ast').innerHTML = `<div class="card"><h2>👩‍🏫 O‘qituvchi o‘rni</h2><p>${d.teacherBusy ? '🔴 Band — o‘qituvchi kirgan' : '🟢 Bo‘sh'}</p>${d.teacherBusy ? '<button class="red" onclick="rel()">O‘qituvchini chiqarib, o‘rinni bo‘shatish</button>' : ''}</div>
    <div class="card"><h2>👥 Studentlar (${d.students.length})</h2>` + (d.students.map(s => `<div class="al q"><b>${esc(s.name)}</b> <small>(${esc(s.login)})</small> ${s.m ? '<span class="pill">' + s.m + '-oy</span>' : ''} ${S[s.status]} ${s.score != null ? s.score + '/' + s.total + ' (' + pct(s) + '%)' : ''} · chiqish: ${s.left}<br><button class="sm" onclick="showAns('${esc(s.login)}',${s.m || 1})">👁 Javoblar</button> <button class="sm" onclick="setPass('${esc(s.login)}')">🔑 Parol</button>
      ${s.status !== 'waiting' ? `<button class="sm" onclick="retake('${esc(s.login)}',${s.m})">🔁 Qayta</button> ` : ''}<button class="red" onclick="delSt('${esc(s.login)}')">🗑 O‘chirish</button></div>`).join('') || 'Hali studentlar yo‘q') + '</div>';
        } catch {}
    }
    async function rel() { if (confirm('O‘qituvchi sessiyasi tugatiladi. Davom etasizmi?')) { await api('a/release', 'POST'); adminState(); } }
    async function delSt(l) { if (confirm('Student butunlay o‘chirilsinmi?')) { await api('a/student/' + encodeURIComponent(l), 'DELETE'); adminState(); } }
    async function clr() { if (confirm('Butun natijalar va voqealar tarixi o‘chiriladi. Davom etasizmi?')) { await api('a/clear', 'POST'); loadHist(); } }

    function boot() { if (token && role === 'teacher') teacherView(); else if (token && role === 'admin') adminView(); else if (token && role === 'student') studentView(); else home(); }
    boot();
</script>
</body>
</html>
